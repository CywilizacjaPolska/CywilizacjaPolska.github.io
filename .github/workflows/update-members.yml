name: Synchronizacja Discord i Statbot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalacja bibliotek
        run: pip install discord.py requests

      - name: Pobieranie danych ze Statbota i Discorda
        env:
          TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          python3 -c '
          import discord, json, os, requests, datetime

          guild_id = os.environ["GUILD_ID"]
          statbot_data = {}
          
          try:
              url = f"https://api.statbot.net/v3/guild/{guild_id}/members"
              response = requests.get(url, timeout=10)
              if response.status_code == 200:
                  res_json = response.json()
                  members_arr = res_json.get("result", {}).get("members", [])
                  if not members_arr and isinstance(res_json.get("result"), list):
                      members_arr = res_json.get("result")
                  
                  for user in members_arr:
                      uid = str(user.get("id") or user.get("user_id", ""))
                      if uid:
                          statbot_data[uid] = {
                              "messages": user.get("messages", 0),
                              "voice_time_mins": user.get("voice", user.get("voice_time", 0))
                          }
          except Exception as e:
              print(f"Błąd Statbota: {e}")

          intents = discord.Intents.default()
          intents.members = True
          intents.presences = True

          client = discord.Client(intents=intents)
          guild_id_int = int(guild_id)

          @client.event
          async def on_ready():
              guild = client.get_guild(guild_id_int)
              if not guild:
                  await client.close()
                  return

              existing_data = {}
              if os.path.exists("members.json"):
                  try:
                      with open("members.json", "r", encoding="utf-8") as f:
                          old_list = json.load(f)
                          if isinstance(old_list, list):
                              existing_data = {str(m["id"]): m for m in old_list}
                  except Exception:
                      pass

              members_list = []
              rank = 1

              sorted_members = sorted(
                  [m for m in guild.members if not m.bot],
                  key=lambda m: (-m.top_role.position, m.display_name.lower())
              )

              for member in sorted_members:
                  mid = str(member.id)
                  top_role = member.top_role
                  role_name = top_role.name if top_role and top_role.name != "@everyone" else "Gracz"
                  role_color = str(top_role.color) if top_role and top_role.color.value != 0 else "#d4a017"
                  
                  all_roles = [r.name for r in member.roles if r.name != "@everyone"]
                  
                  status_str = "online" if str(member.status) in ["online", "idle", "dnd"] else "offline"
                  avatar_url = member.display_avatar.url if member.display_avatar else "https://cdn.discordapp.com/embed/avatars/0.png"

                  # Pobieranie statusu niestandardowego (Custom Status) lub aktywnej gry/muzyki
                  custom_status = ""
                  main_game = "Brak"
                  
                  if status_str == "online":
                      main_game = "Aktywny na Discordzie"
                      if member.activities:
                          for act in member.activities:
                              if act.type == discord.ActivityType.custom and act.state:
                                  custom_status = act.state
                              elif isinstance(act, discord.Spotify):
                                  main_game = f"Słucha Spotify: {act.title} - {act.artist}"
                                  break
                              elif act.type == discord.ActivityType.listening:
                                  main_game = f"Słucha: {act.name}"
                                  break
                              elif isinstance(act, discord.Game) or act.type == discord.ActivityType.playing:
                                  main_game = act.name
                                  break
                              elif act.name and act.type != discord.ActivityType.custom:
                                  main_game = act.name
                                  break

                  # Obliczanie dni i tytułu weterana
                  joined_days = 0
                  joined_str = "Brak danych"
                  veteran_title = "Podróżnik"
                  
                  if member.joined_at:
                      joined_str = member.joined_at.strftime("%d.%m.%Y")
                      delta = datetime.datetime.now(datetime.timezone.utc) - member.joined_at
                      joined_days = delta.days
                      
                      if joined_days > 365:
                          veteran_title = "Legenda Osady"
                      elif joined_days > 180:
                          veteran_title = "Weteran Survivalu"
                      elif joined_days > 60:
                          veteran_title = "Obywatel w Sieci"
                      elif joined_days > 14:
                          veteran_title = "Zwiadowca"
                      else:
                          veteran_title = "Świeżak"

                  old_member = existing_data.get(mid, {})
                  sb_user = statbot_data.get(mid, {})
                  messages = sb_user.get("messages", old_member.get("messages", 0))
                  
                  v_mins = sb_user.get("voice_time_mins", 0)
                  if v_mins > 0:
                      voice_time = f"{v_mins // 60}h {v_mins % 60}m"
                  else:
                      voice_time = old_member.get("voice_time", "0h 0m")

                  merged_member = {
                      "id": mid,
                      "name": member.display_name,
                      "handle": f"@{member.name}",
                      "avatar": avatar_url,
                      "status": status_str,
                      "role": role_name,
                      "role_color": role_color,
                      "all_roles": all_roles if all_roles else [role_name],
                      "level": old_member.get("level", max(1, top_role.position if top_role else 1)),
                      "xp": old_member.get("xp", messages * 2 + 750),
                      "rank": rank,
                      "tokens": old_member.get("tokens", 0),
                      "messages": messages,
                      "voice_time": voice_time,
                      "main_game": main_game,
                      "custom_status": custom_status,
                      "joined": joined_str,
                      "joined_days": joined_days,
                      "veteran_title": veteran_title,
                      "equipment": old_member.get("equipment", {"weapon": "Brak", "armor": "Brak", "amulet": "Brak"}),
                      "achievements": old_member.get("achievements", []),
                      "recent_activity": old_member.get("recent_activity", [])
                  }

                  members_list.append(merged_member)
                  rank += 1

              with open("members.json", "w", encoding="utf-8") as f:
                  json.dump(members_list, f, indent=2, ensure_ascii=False)

              await client.close()

          client.run(os.environ["TOKEN"])
          '

      - name: Zapisanie zmian w repozytorium
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add members.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna synchronizacja statusu i rang" && git push)