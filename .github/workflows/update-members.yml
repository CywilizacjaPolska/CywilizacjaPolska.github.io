name: Synchronizacja Discord i Statbot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalacja bibliotek
        run: pip install discord.py requests

      - name: Pobieranie danych ze Statbota i Discorda
        env:
          TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          python3 -c '
          import discord, json, os, requests, datetime

          guild_id = os.environ["GUILD_ID"]
          statbot_data = {}
          
          try:
              url = f"https://api.statbot.net/v3/guild/{guild_id}/members"
              response = requests.get(url, timeout=10)
              if response.status_code == 200:
                  res_json = response.json()
                  members_arr = res_json.get("result", {}).get("members", [])
                  if not members_arr and isinstance(res_json.get("result"), list):
                      members_arr = res_json.get("result")
                  
                  for user in members_arr:
                      uid = str(user.get("id") or user.get("user_id", ""))
                      if uid:
                          statbot_data[uid] = {
                              "messages": user.get("messages", 0),
                              "voice_time_mins": user.get("voice", user.get("voice_time", 0))
                          }
          except Exception as e:
              print(f"Błąd Statbota: {e}")

          IGNORED_GAMES = {"Visual Studio Code", "Spotify", "Custom Status"}

          def format_relative_time(iso_str, now_dt):
              try:
                  past = datetime.datetime.fromisoformat(iso_str)
                  seconds = int((now_dt - past).total_seconds())
                  if seconds < 900:
                      return "Przed chwilą"
                  elif seconds < 3600:
                      return f"{seconds // 60} min. temu"
                  elif seconds < 86400:
                      return f"{seconds // 3600} godz. temu"
                  elif seconds < 604800:
                      return f"{seconds // 86400} d. temu"
                  else:
                      return f"{seconds // 604800} tyg. temu"
              except Exception:
                  return "Niedawno"

          intents = discord.Intents.default()
          intents.members = True
          intents.presences = True

          client = discord.Client(intents=intents)
          guild_id_int = int(guild_id)

          @client.event
          async def on_ready():
              guild = client.get_guild(guild_id_int)
              if not guild:
                  await client.close()
                  return

              existing_data = {}
              if os.path.exists("members.json"):
                  try:
                      with open("members.json", "r", encoding="utf-8") as f:
                          old_list = json.load(f)
                          if isinstance(old_list, list):
                              existing_data = {str(m["id"]): m for m in old_list}
                  except Exception:
                      pass

              members_list = []
              rank = 1
              now = datetime.datetime.now(datetime.timezone.utc)

              sorted_members = sorted(
                  [m for m in guild.members if not m.bot],
                  key=lambda m: (-m.top_role.position, m.display_name.lower())
              )

              for member in sorted_members:
                  mid = str(member.id)
                  old_member = existing_data.get(mid, {})
                  top_role = member.top_role
                  role_name = top_role.name if top_role and top_role.name != "@everyone" else "Gracz"
                  role_color = str(top_role.color) if top_role and top_role.color.value != 0 else "#d4a017"
                  
                  all_roles = [r.name for r in member.roles if r.name != "@everyone"]
                  
                  status_str = "online" if str(member.status) in ["online", "idle", "dnd"] else "offline"
                  avatar_url = member.display_avatar.url if member.display_avatar else "https://cdn.discordapp.com/embed/avatars/0.png"

                  custom_status = ""
                  main_game = "Brak"
                  detected_game = None
                  detected_icon = None
                  
                  if status_str == "online":
                      main_game = "Aktywny na Discordzie"
                      if member.activities:
                          for act in member.activities:
                              if act.type == discord.ActivityType.custom and act.state:
                                  custom_status = act.state
                              elif isinstance(act, discord.Spotify):
                                  main_game = f"Słucha Spotify: {act.title} - {act.artist}"
                              elif act.type == discord.ActivityType.listening:
                                  main_game = f"Słucha: {act.name}"
                              elif isinstance(act, discord.Game) or act.type == discord.ActivityType.playing:
                                  main_game = act.name
                                  if act.name not in IGNORED_GAMES:
                                      detected_game = act.name
                                      if hasattr(act, "large_image_url") and act.large_image_url:
                                          detected_icon = act.large_image_url
                                  break
                              elif act.name and act.type != discord.ActivityType.custom:
                                  main_game = act.name
                                  break

                  # Aktualizacja historii gier i cache ikon
                  activity_log = old_member.get("activity_log", [])
                  game_counts = old_member.get("game_counts", {})
                  game_icons = old_member.get("game_icons", {})

                  def get_fallback_game_icon(game_name: str):
                      if game_name in game_icons and game_icons[game_name]:
                          return game_icons[game_name]
                      try:
                          r = requests.get(
                              "https://store.steampowered.com/api/storesearch/",
                              params={"term": game_name, "l": "polish", "cc": "PL"},
                              timeout=6,
                          )
                          if r.status_code == 200:
                              items = r.json().get("items") or []
                              if items and items[0].get("tiny_image"):
                                  game_icons[game_name] = items[0]["tiny_image"]
                                  return game_icons[game_name]
                      except Exception:
                          pass
                      game_icons.setdefault(game_name, None)
                      return None

                  # Zapisz istniejące ikony z wcześniejszych wpisów do cache
                  for old_item in activity_log:
                      g_name = old_item.get("game")
                      g_icon = old_item.get("icon")
                      if g_name and g_icon and not game_icons.get(g_name):
                          game_icons[g_name] = g_icon

                  if detected_game:
                      game_counts[detected_game] = game_counts.get(detected_game, 0) + 1

                      icon_to_use = detected_icon or game_icons.get(detected_game) or get_fallback_game_icon(detected_game)
                      if icon_to_use:
                          game_icons[detected_game] = icon_to_use

                      existing_idx = next((i for i, item in enumerate(activity_log) if item.get("game") == detected_game), None)
                      if existing_idx is not None:
                          prev_entry = activity_log.pop(existing_idx)
                          prev_icon = icon_to_use or prev_entry.get("icon")
                          activity_log.insert(0, {
                              "game": detected_game,
                              "timestamp": now.isoformat(),
                              "time": "Teraz",
                              "tag": prev_entry.get("tag") or "Ostatnio grane",
                              "icon": prev_icon
                          })
                      else:
                          activity_log.insert(0, {
                              "game": detected_game,
                              "timestamp": now.isoformat(),
                              "time": "Teraz",
                              "tag": "Nowy gracz",
                              "icon": icon_to_use
                          })

                  # Scal istniejące duplikaty tej samej gry na liście i uzupełnij brakujące ikony
                  deduped_log = []
                  seen_games = set()
                  for entry in activity_log:
                      g_name = entry.get("game")
                      if not g_name or g_name in seen_games:
                          continue
                      seen_games.add(g_name)
                      if not entry.get("icon"):
                          entry["icon"] = game_icons.get(g_name) or get_fallback_game_icon(g_name)
                      deduped_log.append(entry)

                  activity_log = deduped_log[:5]

                  for i, entry in enumerate(activity_log):
                      if i == 0 and detected_game == entry.get("game"):
                          entry["time"] = "Teraz"
                      elif "timestamp" in entry:
                          entry["time"] = format_relative_time(entry["timestamp"], now)

                  # Wyznaczenie najczęściej granej gry (faction)
                  if game_counts:
                      faction = max(game_counts.items(), key=lambda x: x[1])[0]
                  else:
                      faction = old_member.get("faction", detected_game or "Wędrowiec")

                  # Obliczanie dni i tytułu weterana
                  joined_days = 0
                  joined_str = "Brak danych"
                  veteran_title = "Podróżnik"
                  
                  if member.joined_at:
                      joined_str = member.joined_at.strftime("%d.%m.%Y")
                      delta = now - member.joined_at
                      joined_days = delta.days
                      
                      if joined_days >= 365:
                          veteran_title = "Legenda Osady"
                      elif joined_days >= 180:
                          veteran_title = "Weteran Survivalu"
                      elif joined_days >= 60:
                          veteran_title = "Obywatel w Sieci"
                      elif joined_days >= 14:
                          veteran_title = "Zwiadowca"
                      else:
                          veteran_title = "Świeżak"

                  sb_user = statbot_data.get(mid, {})
                  messages = sb_user.get("messages", old_member.get("messages", 0))
                  
                  v_mins = sb_user.get("voice_time_mins", 0)
                  if v_mins > 0:
                      voice_time = f"{v_mins // 60}h {v_mins % 60}m"
                  else:
                      voice_time = old_member.get("voice_time", "0h 0m")

                  merged_member = {
                      "id": mid,
                      "name": member.display_name,
                      "handle": f"@{member.name}",
                      "avatar": avatar_url,
                      "status": status_str,
                      "role": role_name,
                      "role_color": role_color,
                      "all_roles": all_roles if all_roles else [role_name],
                      "level": old_member.get("level", max(1, top_role.position if top_role else 1)),
                      "xp": old_member.get("xp", messages * 2 + 750),
                      "rank": rank,
                      "tokens": old_member.get("tokens", 0),
                      "messages": messages,
                      "voice_time": voice_time,
                      "main_game": main_game,
                      "faction": faction,
                      "game_counts": game_counts,
                      "game_icons": game_icons,
                      "activity_log": activity_log,
                      "custom_status": custom_status,
                      "joined": joined_str,
                      "joined_days": joined_days,
                      "veteran_title": veteran_title,
                      "equipment": old_member.get("equipment", {"weapon": "Brak", "armor": "Brak", "amulet": "Brak"}),
                      "achievements": old_member.get("achievements", []),
                      "recent_activity": old_member.get("recent_activity", [])
                  }

                  members_list.append(merged_member)
                  rank += 1

              with open("members.json", "w", encoding="utf-8") as f:
                  json.dump(members_list, f, indent=2, ensure_ascii=False)

              await client.close()

          client.run(os.environ["TOKEN"])
          '

      - name: Zapisanie zmian w repozytorium
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add members.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna synchronizacja statusu i rang" && git push)