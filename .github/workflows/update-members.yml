name: Automatyczna synchronizacja statystyk Discord
on:
  schedule:
    - cron: '0 * * * *' # Uruchamia się co godzinę
  workflow_dispatch:      # Pozwala uruchomić ręcznie w każdej chwili z poziomu GitHub Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalacja biblioteki Discord
        run: pip install discord.py

      - name: Pobieranie danych i aktualizacja members.json
        env:
          TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          python3 -c '
          import discord, json, os

          intents = discord.Intents.default()
          intents.members = True
          intents.presences = True

          client = discord.Client(intents=intents)
          guild_id = int(os.environ["GUILD_ID"])

          @client.event
          async def on_ready():
              guild = client.get_guild(guild_id)
              if not guild:
                  print("Nie znaleziono serwera!")
                  await client.close()
                  return

              # Wczytanie obecnego pliku members.json, aby nie stracić niestandardowych pól
              existing_data = {}
              if os.path.exists("members.json"):
                  try:
                      with open("members.json", "r", encoding="utf-8") as f:
                          old_list = json.load(f)
                          if isinstance(old_list, list):
                              existing_data = {m["id"]: m for m in old_list}
                  except Exception as e:
                      print(f"Błąd odczytu: {e}")

              members_list = []
              rank = 1

              # Sortowanie członków według pozycji najwyższej roli
              sorted_members = sorted(
                  [m for m in guild.members if not m.bot],
                  key=lambda m: (-m.top_role.position, m.display_name.lower())
              )

              for member in sorted_members:
                  mid = str(member.id)
                  role_name = member.top_role.name if member.top_role.name != "@everyone" else "Gracz"
                  status_str = "online" if str(member.status) in ["online", "idle", "dnd"] else "offline"
                  avatar_url = member.display_avatar.url if member.display_avatar else "https://cdn.discordapp.com/embed/avatars/0.png"

                  lvl = max(1, member.top_role.position)
                  old_member = existing_data.get(mid, {})
                  
                  # Zachowujemy dotychczasowe statystyki wiadomości/XP lub ustawiamy domyślne
                  messages = old_member.get("messages", 0)
                  tokens = old_member.get("tokens", 0)
                  xp = old_member.get("xp", lvl * 150)
                  voice_time = old_member.get("voice_time", "0h 0m")

                  merged_member = {
                      "id": mid,
                      "name": member.display_name,
                      "handle": f"@{member.name}",
                      "avatar": avatar_url,
                      "status": status_str,
                      "role": role_name,
                      "level": lvl,
                      "xp": xp,
                      "rank": rank,
                      "tokens": tokens,
                      "messages": messages,
                      "voice_time": voice_time,
                      "main_game": old_member.get("main_game", "Valheim"),
                      "motto": old_member.get("motto", "Wędrowiec w świecie surviwalu"),
                      "equipment": old_member.get("equipment", {"weapon": "Brak", "armor": "Brak", "amulet": "Brak"}),
                      "achievements": old_member.get("achievements", []),
                      "recent_activity": old_member.get("recent_activity", [])
                  }

                  members_list.append(merged_member)
                  rank += 1

              # Zapis zaktualizowanej listy do members.json
              with open("members.json", "w", encoding="utf-8") as f:
                  json.dump(members_list, f, indent=2, ensure_ascii=False)

              print(f"Zaktualizowano statystyki dla {len(members_list)} graczy!")
              await client.close()

          client.run(os.environ["TOKEN"])
          '

      - name: Automatyczny commit i wypchnięcie zmian na GitHub
        run: |
          git config --global user.name "Statystyki Bot"
          git config --global user.email "bot@github.com"
          git add members.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja statystyk i statusów" && git push)