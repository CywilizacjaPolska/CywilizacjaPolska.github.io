name: Sprawdź status Live YouTube

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz ID aktywnego live
        run: |
          python3 -c '
          import urllib.request
          import re
          import json

          channel_id = "UCRKaPKrCc3IQQVcy_jq95HA"
          url = f"https://www.youtube.com/channel/{channel_id}/live"

          is_live = False
          video_id = ""
          title = ""

          try:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                      "Accept-Language": "pl-PL,pl;q=0.9,en;q=0.8"
                  }
              )
              with urllib.request.urlopen(req, timeout=15) as response:
                  html = response.read().decode("utf-8", errors="ignore")

              # Szukamy unikalnego ID aktywnego streama (musi posiadać znacznik nadawania na żywo)
              if "\"isLiveNow\":true" in html or "\"isLive\":true" in html:
                  # Wyciągamy videoId z bloku transmisji na żywo
                  vid_match = re.search(r"\"videoId\":\"([a-zA-Z0-9_-]{11})\"", html)
                  if vid_match:
                      is_live = True
                      video_id = vid_match.group(1)

          except Exception as e:
              print(f"Błąd: {e}")

          output = {
              "is_live": is_live,
              "video_id": video_id
          }

          with open("youtube_live.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2)

          print(f"Live: {is_live}, ID: {video_id}")
          '

      - name: Zapisz zmiany
        run: |
          git config --global user.name "YouTube Bot"
          git config --global user.email "bot@github.com"
          git add youtube_live.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizacja YouTube Live ID" && git push)