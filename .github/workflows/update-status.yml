name: Aktualizacja statusu serwera
on:
  schedule:
    - cron: '*/5 * * * *' # Uruchamia się automatycznie co 5 minut
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zainstaluj bibliotekę Steam Query
        run: pip install python-a2s

      - name: Pobierz prawdziwą liczbę graczy z serwera
        run: |
          python3 -c '
          import a2s, json

          ip = "146.59.1.3"
          # Porty zapytań Steam (Query Port) dla Conan Exiles
          ports_to_try = [27015, 20800, 20801, 7777]
          
          online = False
          players_str = "0/10"

          for port in ports_to_try:
              try:
                  info = a2s.info((ip, port), timeout=3.0)
                  online = True
                  players_str = f"{info.player_count}/{info.max_players}"
                  print(f"Sukces na porcie {port}: {players_str}")
                  break
              except Exception as e:
                  continue

          data = {
              "online": online,
              "players": players_str
          }

          with open("status.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          '

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "Status Bot"
          git config --global user.email "bot@github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizacja liczby graczy" && git push)