name: Aktualizacja statusu serwera
on:
  schedule:
    - cron: '*/5 * * * *' # Sprawdza serwer co 5 minut
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz status ze strony GameTracker (omijając firewall)
        run: |
          python3 -c '
          import urllib.request
          import re
          import json

          url = "https://www.gametracker.com/server_info/146.59.1.3:20800/"
          req = urllib.request.Request(
              url, 
              headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          )

          online = False
          players_str = "0/10"

          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  html = response.read().decode("utf-8")
                  
                  # Sprawdzamy czy serwer jest online na GameTrackerze
                  if "Online" in html and "Server Offline" not in html:
                      online = True
                      
                  # Szukamy liczby graczy w formacie X / Y
                  matches = re.findall(r">([0-9]{1,2})\s*</span[^>]*>\s*/\s*<span[^>]*>([0-9]{1,2})<", html)
                  if matches:
                      players_str = f"{matches[0][0]}/{matches[0][1]}"
                  else:
                      all_matches = re.findall(r"\b([0-9]{1,2})\s*/\s*([0-9]{1,2})\b", html)
                      for cur, mx in all_matches:
                          if int(mx) > 1 and int(mx) <= 100:
                              players_str = f"{cur}/{mx}"
                              break

          except Exception as e:
              print("Błąd pobierania:", e)
              online = False

          data = {
              "online": online,
              "players": players_str if online else "0/10"
          }

          with open("status.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          print("Zapisano status:", data)
          '

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "Status Bot"
          git config --global user.email "bot@github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizacja statusu serwera" && git push)