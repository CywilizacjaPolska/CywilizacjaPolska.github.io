name: Aktualizacja statusu serwera
on:
  schedule:
    - cron: '*/5 * * * *' # Sprawdza serwer co 5 minut
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalacja Gamedig
        run: npm install gamedig

      - name: Sprawdź serwer Conan Exiles przez Gamedig
        run: |
          node -e '
          const { Gamedig } = require("gamedig");
          const fs = require("fs");

          async function checkServer() {
            try {
              const state = await Gamedig.query({
                type: "conanexiles",
                host: "146.59.1.3",
                port: 20800
              });
              
              const data = {
                online: true,
                players: `${state.players.length}/${state.maxplayers}`
              };
              fs.writeFileSync("status.json", JSON.stringify(data, null, 2));
              console.log("Serwer ONLINE:", data);
            } catch (error) {
              console.log("Serwer OFFLINE:", error.message);
              const data = {
                online: false,
                players: "0/10"
              };
              fs.writeFileSync("status.json", JSON.stringify(data, null, 2));
            }
          }
          checkServer();
          '

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "Status Bot"
          git config --global user.email "bot@github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja statusu" && git push)