name: Sprawdź status Live YouTube (Strict)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź czy kanał faktycznie nadaje na żywo
        run: |
          python3 -c '
          import urllib.request
          import re
          import json

          channel_id = "UCRKaPKrCc3IQQVcy_jq95HA"
          url = f"https://www.youtube.com/channel/{channel_id}/live"

          is_live = False
          video_id = ""

          try:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                      "Accept-Language": "en-US,en;q=0.9"
                  }
              )
              # YouTube automatycznie przekierowuje /live na /watch?v=... TYLKO GDY TRWA TRANSMISJA
              with urllib.request.urlopen(req, timeout=15) as response:
                  final_url = response.url
                  html = response.read().decode("utf-8", errors="ignore")

              # Warunek: URL musi wskazywać na /watch oraz kod strony musi potwierdzać isLiveNow
              if "/watch?v=" in final_url and '"isLiveNow":true' in html:
                  match = re.search(r"v=([a-zA-Z0-9_-]{11})", final_url)
                  if match:
                      is_live = True
                      video_id = match.group(1)
              elif '"isLiveNow":true' in html:
                  vid_match = re.search(r"\"videoId\":\"([a-zA-Z0-9_-]{11})\"", html)
                  if vid_match:
                      is_live = True
                      video_id = vid_match.group(1)

          except Exception as e:
              print(f"Błąd sprawdzania live: {e}")

          output = {
              "is_live": is_live,
              "video_id": video_id if is_live else ""
          }

          with open("youtube_live.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2)

          print(f"Status Live: {is_live}, ID: {video_id}")
          '

      - name: Zapisz zmiany w pliku JSON
        run: |
          git config --global user.name "YouTube Bot"
          git config --global user.email "bot@github.com"
          git add youtube_live.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizacja statusu YouTube Live" && git push)