name: Aktualizacja statusu serwera
on:
  schedule:
    - cron: '*/5 * * * *' # Uruchamia się automatycznie co 5 minut
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz status z BattleMetrics API
        run: |
          python3 -c '
          import requests, json

          try:
              url = "https://api.battlemetrics.com/servers?filter[ip]=146.59.1.3&filter[port]=20800"
              res = requests.get(url, timeout=10)
              data = res.json()
              
              online = False
              players_str = "0/10"
              
              if data.get("data") and len(data["data"]) > 0:
                  attr = data["data"][0]["attributes"]
                  if attr.get("status") == "online":
                      online = True
                      current = attr.get("players", 0)
                      maximum = attr.get("maxPlayers", 10)
                      players_str = f"{current}/{maximum}"
                      
              output = {
                  "online": online,
                  "players": players_str
              }
          except Exception as e:
              print("Błąd pobierania:", e)
              output = {"online": false, "players": "0/10"}

          with open("status.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2)
          '

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "Status Bot"
          git config --global user.email "bot@github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja statusu" && git push)