name: Aktualizacja statusu serwera

on:
  schedule:
    - cron: '*/10 * * * *'  # Uruchamia się automatycznie co 10 minut
  workflow_dispatch:

permissions:
  contents: write  # Kluczowe: pozwala automatycznemu zadaniu na zapisywanie zmian w repozytorium

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź serwer Conan Exiles przez UDP i zaktualizuj status
        run: |
          python3 -c '
          import socket
          import json

          IP = "146.59.1.3"
          PORT = 20800

          def check_game_server(ip, port):
              packet = b"\xFF\xFF\xFF\xFF\x54Source Engine Query\x00"
              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sock.settimeout(4.0)
              try:
                  sock.sendto(packet, (ip, port))
                  data, _ = sock.recvfrom(1400)
                  if len(data) > 4 and data[4:5] == b"I":
                      return True
              except Exception:
                  pass
              finally:
                  sock.close()
              return False

          is_online = check_game_server(IP, PORT)

          if is_online:
              status_text = "Online (0/10)"
              online_bool = True
          else:
              status_text = "Offline"
              online_bool = False

          data = {
              "status": status_text,
              "online": online_bool,
              "ip": f"{IP}:{PORT}"
          }

          with open("status.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f"Zaktualizowano status: {status_text}")
          '

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "Status Bot"
          git config --global user.email "bot@github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja statusu serwera" && git push)