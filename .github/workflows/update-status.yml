name: Aktualizacja statusu serwera
on:
  schedule:
    - cron: '*/5 * * * *' # Uruchamia się automatycznie co 5 minut
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź port serwera i zaktualizuj JSON
        run: |
          python3 -c '
          import socket, json
          ip = "146.59.1.3"
          port = 20800
          online = False
          
          try:
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.settimeout(3)
              result = sock.connect_ex((ip, port))
              if result == 0:
                  online = True
              sock.close()
          except:
              online = False

          data = {
              "online": online,
              "players": "2/10" if online else "0/10"
          }
          
          with open("status.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          '

      - name: Zapisz zmiany w repozytorium
        run: |
          git config --global user.name "Status Bot"
          git config --global user.email "bot@github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja statusu serwera" && git push)