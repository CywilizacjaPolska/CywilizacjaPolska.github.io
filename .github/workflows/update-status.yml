name: Aktualizacja statusu serwerów

on:
  schedule:
    - cron: '*/15 * * * *' # Uruchamia automatycznie co 15 minut
  workflow_dispatch: # Pozwala na uruchomienie ręczne przyciskiem w zakładce "Actions" na GitHubie

jobs:
  update-status:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Uprawnienie pozwalające skryptowi na zapisywanie zmian (commitów) w repozytorium

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacja biblioteki gamedig
        run: npm install gamedig

      - name: Uruchomienie skryptu sprawdzającego serwery
        run: node update-status.js

      - name: Zapisanie i wysłanie zmiany pliku status.json na GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automatyczna aktualizacja status.json [skip ci]" && git push)